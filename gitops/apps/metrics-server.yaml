# Composant de plateforme installé par chart Helm, mais décrit comme TOUT le reste : un fichier dans Git.
# `sources` en liste = chart tiré d'un dépôt Helm + valeurs tirées de NOTRE dépôt Git (ref: values -> $values/...).
# Le chart reste celui de la communauté, la configuration reste à nous, sans fork ni copie du chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"   # 0 = fondations (CRD, API de métriques) ; elles doivent être saines avant la vague 1
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # supprimer cette Application supprime aussi ce qu'elle a déployé
spec:
  project: lab
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: 3.14.0
      helm:
        valueFiles:
          - $values/platform/metrics-server-values.yaml
    - repoURL: https://github.com/hcridlig/k8s-ml-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:                       # filet de sécurité : une ressource qui échoue (ordre, CRD pas encore prête) est retentée
      limit: 5
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
