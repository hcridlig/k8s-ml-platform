apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loadtest
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # 1 = ce qui utilise les CRD et services des fondations
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # supprimer cette Application supprime aussi ce qu'elle a déployé
spec:
  project: lab
  sources:
    - repoURL: https://github.com/hcridlig/k8s-ml-platform.git
      targetRevision: main
      path: loadtest
  destination:
    server: https://kubernetes.default.svc
    namespace: loadtest
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:                       # filet de sécurité : une ressource qui échoue (ordre, CRD pas encore prête) est retentée
      limit: 5
      backoff: {duration: 20s, factor: 2, maxDuration: 5m}
