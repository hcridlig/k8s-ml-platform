# PrometheusRule = des alertes en code. Chaque règle est une requête PromQL ; `for` impose qu'elle reste vraie
# pendant toute cette durée avant de se déclencher (évite les fausses alertes sur un pic d'une seconde).
# Elles s'affichent dans Prometheus (onglet Alerts). Sans Alertmanager, rien n'est envoyé : c'est la phase suivante.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ml-api
  namespace: ml-platform
spec:
  groups:
    - name: ml-api.symptomes        # ce que l'utilisateur ressent : indisponibilité, erreurs, lenteur
      rules:
        - alert: MlApiDown
          expr: absent(up{job="ml-api", namespace="ml-platform"} == 1)
          for: 1m
          labels: {severity: critical}
          annotations:
            summary: "Plus aucun pod ml-api ne répond aux scrapes"
            runbook: "kubectl -n ml-platform get pods ; kubectl -n ml-platform describe pod <pod>"

        - alert: MlApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{job="ml-api", namespace="ml-platform", status="5xx"}[2m]))
            / sum(rate(http_requests_total{job="ml-api", namespace="ml-platform"}[2m])) > 0.05
          for: 2m
          labels: {severity: critical}
          annotations:
            summary: "Plus de 5 % des requêtes finissent en erreur 5xx"
            runbook: "kubectl -n ml-platform logs deploy/ml-api --tail=50"

        - alert: MlApiHighLatency
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_request_duration_seconds_bucket{job="ml-api", namespace="ml-platform", handler="/predict"}[2m]))
            ) > 0.3
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "95 % des prédictions prennent plus de 300 ms"
            runbook: "Regarder le CPU par pod et le bridage dans Grafana ; l'autoscaler est-il au plafond ?"

    - name: ml-api.causes           # ce qui l'explique : capacité, ressources, stabilité
      rules:
        - alert: MlApiAutoscalerAtMax
          expr: |
            kube_horizontalpodautoscaler_status_desired_replicas{namespace="ml-platform", horizontalpodautoscaler="ml-api"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="ml-platform", horizontalpodautoscaler="ml-api"}
          for: 2m
          labels: {severity: warning}
          annotations:
            summary: "L'autoscaler a atteint maxReplicas : il ne peut plus absorber de charge"
            runbook: "Relever maxReplicas dans 30-hpa.yaml si le cluster a les ressources, sinon réduire la charge"

        - alert: MlApiCpuThrottled
          expr: |
            sum(rate(container_cpu_cfs_throttled_periods_total{namespace="ml-platform", pod=~"ml-api-.*", container="api"}[2m]))
            / sum(rate(container_cpu_cfs_periods_total{namespace="ml-platform", pod=~"ml-api-.*", container="api"}[2m])) > 0.25
          for: 3m
          labels: {severity: warning}
          annotations:
            summary: "Les pods sont bridés par leur limite CPU plus d'un quart du temps"

        - alert: MlApiPodRestarting
          expr: increase(kube_pod_container_status_restarts_total{namespace="ml-platform", pod=~"ml-api-.*"}[10m]) > 0
          for: 1m
          labels: {severity: warning}
          annotations:
            summary: "Le pod {{ $labels.pod }} a redémarré dans les 10 dernières minutes"
            runbook: "kubectl -n ml-platform describe pod {{ $labels.pod }}  (section Last State : OOMKilled ou Error ?)"
