# ConfigMap lu par le sidecar de Grafana : tout ConfigMap portant le label grafana_dashboard="1", dans n'importe quel
# namespace, devient un dashboard. Donc : le dashboard est du code versionné, pas un clic dans une interface.
# Pour le modifier : le changer dans Grafana, puis Exporter > JSON, et recoller le JSON ci-dessous.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ml-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ml-api.json: |
    {
      "uid": "ml-api-overview",
      "title": "ml-api : trafic, latence et autoscaling",
      "tags": [
        "ml-api"
      ],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timezone": "browser",
      "templating": {
        "list": [
          {
            "name": "datasource",
            "label": "Source",
            "type": "datasource",
            "query": "prometheus",
            "current": {},
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requêtes par seconde",
          "description": "Trafic réel reçu par l'ensemble des pods, sans les sondes de santé.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(http_requests_total{job=\"ml-api\", namespace=\"ml-platform\", handler=\"/predict\"}[$__rate_interval]))",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 1
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Latence p95",
          "description": "95 % des requêtes vont plus vite que cette valeur. Orange au-delà de 300 ms : c'est le seuil de l'alerte MlApiHighLatency.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"ml-api\", namespace=\"ml-platform\", handler=\"/predict\"}[$__rate_interval])))",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.3
                  },
                  {
                    "color": "red",
                    "value": 0.5
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 3
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Pods prêts",
          "description": "Pods qui passent leur readinessProbe, donc qui reçoivent du trafic. Rouge sous le minimum du PodDisruptionBudget (2).",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"ml-platform\", deployment=\"ml-api\"}",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 2
                  },
                  {
                    "color": "green",
                    "value": 3
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Erreurs 5xx",
          "description": "Part des requêtes qui échouent côté serveur. Rouge au-delà de 5 % : seuil de l'alerte MlApiHighErrorRate.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "(sum(rate(http_requests_total{job=\"ml-api\", namespace=\"ml-platform\", status=\"5xx\"}[$__rate_interval])) or vector(0)) / sum(rate(http_requests_total{job=\"ml-api\", namespace=\"ml-platform\"}[$__rate_interval]))",
              "legendFormat": "",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requêtes par seconde et par pod",
          "description": "Répartition du trafic entre pods. Des courbes très différentes signalent un équilibrage inégal : voir l'expérience KEEPALIVE du README.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(http_requests_total{job=\"ml-api\", namespace=\"ml-platform\", handler=\"/predict\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "normal"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latence des prédictions",
          "description": "Temps de réponse mesuré par le serveur. Quand les pods atteignent leur limite CPU, p95 et p99 décollent avant p50.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 4,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.5, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"ml-api\", namespace=\"ml-platform\", handler=\"/predict\"}[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"ml-api\", namespace=\"ml-platform\", handler=\"/predict\"}[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{job=\"ml-api\", namespace=\"ml-platform\", handler=\"/predict\"}[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Pods : voulus, prêts et bornes de l'autoscaler",
          "description": "L'écart entre « voulus » et « prêts » est le temps de démarrage des pods. Quand « voulus » colle au maximum, l'autoscaler est au plafond.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"ml-platform\", horizontalpodautoscaler=\"ml-api\"}",
              "legendFormat": "voulus par l'autoscaler",
              "refId": "A",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"ml-platform\", deployment=\"ml-api\"}",
              "legendFormat": "prêts",
              "refId": "B",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_horizontalpodautoscaler_spec_min_replicas{namespace=\"ml-platform\", horizontalpodautoscaler=\"ml-api\"}",
              "legendFormat": "minimum",
              "refId": "C",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"ml-platform\", horizontalpodautoscaler=\"ml-api\"}",
              "legendFormat": "maximum",
              "refId": "D",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "minimum"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        8
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "maximum"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        8
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "CPU moyen par rapport à la demande",
          "description": "La mesure que l'autoscaler regarde. Au-dessus de la cible il ajoute des pods ; très au-dessus de 100 %, les pods consomment plus que ce qu'ils ont réservé.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 12,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"ml-platform\", pod=~\"ml-api-.*\", container=\"api\"}[$__rate_interval])) / sum(kube_pod_container_resource_requests{namespace=\"ml-platform\", pod=~\"ml-api-.*\", container=\"api\", resource=\"cpu\"})",
              "legendFormat": "CPU utilisé / demandé",
              "refId": "A",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "vector(0.5)",
              "legendFormat": "cible de l'autoscaler",
              "refId": "B",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "cible de l'autoscaler"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        8
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Bridage CPU (throttling) par pod",
          "description": "Part du temps où le noyau a retenu le pod parce qu'il avait atteint sa limite CPU. C'est ce qui fait grimper la latence.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 20,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(container_cpu_cfs_throttled_periods_total{namespace=\"ml-platform\", pod=~\"ml-api-.*\", container=\"api\"}[$__rate_interval])) / sum by (pod) (rate(container_cpu_cfs_periods_total{namespace=\"ml-platform\", pod=~\"ml-api-.*\", container=\"api\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Mémoire par pod",
          "description": "Mémoire réellement utilisée. Un pod qui touche la limite est tué (OOMKilled) puis redémarré.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 8,
            "y": 20,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "container_memory_working_set_bytes{namespace=\"ml-platform\", pod=~\"ml-api-.*\", container=\"api\"}",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "editorMode": "code"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "max(kube_pod_container_resource_limits{namespace=\"ml-platform\", pod=~\"ml-api-.*\", container=\"api\", resource=\"memory\"})",
              "legendFormat": "limite",
              "refId": "B",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "limite"
                },
                "properties": [
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        8,
                        8
                      ]
                    }
                  },
                  {
                    "id": "custom.fillOpacity",
                    "value": 0
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Redémarrages de conteneurs (5 dernières minutes)",
          "description": "Chaque marche est un redémarrage : crash, OOMKilled ou échec de la livenessProbe.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 16,
            "y": 20,
            "w": 8,
            "h": 7
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (increase(kube_pod_container_status_restarts_total{namespace=\"ml-platform\", pod=~\"ml-api-.*\"}[5m]))",
              "legendFormat": "{{pod}}",
              "refId": "A",
              "editorMode": "code"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 12,
                "showPoints": "never",
                "spanNulls": false,
                "stacking": {
                  "mode": "none"
                }
              },
              "min": 0
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ]
    }
