# Chaîne CI : tester -> construire -> scanner -> publier -> signer -> déclencher le déploiement.
# (La validation des manifestes est dans validate.yaml.)
#
# Le déploiement lui-même n'est PAS fait ici : la CI ne parle jamais au cluster. Son dernier geste est un commit qui change
# le tag d'image dans overlays/lab/kustomization.yaml ; c'est ArgoCD, qui tourne DANS le cluster, qui constate la différence
# entre Git et le cluster et déploie (modèle "pull"). Conséquences : aucun identifiant du cluster dans GitHub, et tout
# changement de prod est un commit relisible, annulable avec `git revert`.
#
# Toutes les actions tierces sont épinglées par SHA de commit (le commentaire donne la version lisible), pas par tag :
# un tag peut être déplacé par un attaquant, un SHA non. C'est exactement ce qui s'est passé avec trivy-action en mars 2026
# (tags réécrits pour voler des secrets). Dependabot (voir .github/dependabot.yml) propose les mises à jour de ces SHA.
name: ci

# Déclenché seulement quand ce qui finit DANS une image change. Pourquoi pas "tout push" : le commit de promotion (qui ne touche
# que overlays/) ne doit pas relancer la CI, et un `git revert` de ce commit (= retour arrière) ne doit pas être défait par un
# nouveau build qui re-promouvrait le code le plus récent. Les changements de manifestes sont validés par validate.yaml.
on:
  push:
    branches: [main]
    paths: [app/**, dashboard/**, .github/workflows/ci.yaml]
  pull_request:
    paths: [app/**, dashboard/**, .github/workflows/ci.yaml]

# Moindre privilège : par défaut le jeton ne peut que lire. Chaque job demande en plus ce dont il a besoin.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Sur une PR, un nouveau push rend l'ancien run inutile. Sur main on laisse finir : on ne coupe pas une publication en cours.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements-dev.txt
        working-directory: app
      # train.py produit model.joblib et samples.json, dont les tests ont besoin (comme le build de l'image).
      - run: python train.py && pytest -q
        working-directory: app

  images:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write   # publier dans GHCR (ghcr.io) avec le jeton du run : pas de mot de passe à stocker
      id-token: write   # jeton OIDC : sert à signer l'image sans clé (cosign "keyless")
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: ml-api, context: app}
          - {name: ml-dashboard, context: dashboard}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
      PUSH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Calcule le tag (SHA complet du commit : unique, immuable, retrouvable avec `git log`) et les labels OCI,
      # dont org.opencontainers.image.source qui relie l'image au dépôt (c'est ce qui donne à GHCR les bons droits).
      # Le nom d'image est mis en minuscules automatiquement (GHCR refuse les majuscules).
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,format=long,prefix=

      # Seul ml-api a un ARG MODEL_VERSION : il affiche dans l'interface le commit (7 premiers caractères) qui répond.
      - id: args
        env:
          NAME: ${{ matrix.name }}
        run: |
          if [ "$NAME" = ml-api ]; then echo "build_args=MODEL_VERSION=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"; else echo "build_args=" >> "$GITHUB_OUTPUT"; fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 1) Construire SANS publier (load: true = l'image reste sur le runner) pour pouvoir la scanner d'abord.
      #    Le cache GitHub Actions garde les couches : le 2e build (publication) est quasi instantané.
      - name: Construire (local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      # 2) Scanner l'image : vulnérabilités connues dans l'OS et les paquets Python. Échoue (exit-code 1) s'il y a du
      #    HIGH/CRITICAL pour lequel un correctif existe ; ignore-unfixed évite de bloquer sur ce qu'on ne peut pas corriger.
      #    Une CVE à accepter en connaissance de cause se déclare dans .trivyignore (avec sa justification).
      - name: Scanner avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          version: v0.70.0
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore

      # 3) Seulement après un scan propre, et seulement sur main (jamais depuis une PR), on publie.
      - name: Se connecter à GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.build_args }}
          cache-from: type=gha,scope=${{ matrix.name }}

      # 4) Signer l'image (par son digest, pas par son tag) avec l'identité de ce workflow, enregistrée dans le journal
      #    public Sigstore. Quiconque peut ensuite vérifier que l'image vient bien de CE dépôt et de CE workflow :
      #    cosign verify --certificate-identity-regexp 'https://github.com/<owner>/<repo>/' \
      #      --certificate-oidc-issuer https://token.actions.githubusercontent.com <image>@<digest>
      #    (Appliquer cette vérification dans le cluster à l'admission = politique Kyverno, prévue en phase 4.)
      - name: Installer cosign
        if: env.PUSH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Signer l'image
        if: env.PUSH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE,,}@${DIGEST}"

  # Dernier maillon : écrire dans Git le tag des images qu'on vient de publier. ArgoCD fait le reste.
  # Les deux images reçoivent le même tag (SHA du commit) : simple et sans ambiguïté, au prix d'un redémarrage de pods pour le
  # composant dont le code n'a pas changé. À partir de plusieurs services indépendants, on promeut chacun avec son propre tag.
  promote:
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # pousser le commit de promotion sur main
    concurrency:
      group: promote
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Pointer l'overlay sur les images de ce commit
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          # Si un commit plus récent a déjà été poussé, son propre run promouvra : on évite de redescendre à une vieille version.
          git fetch -q origin main
          [ "$(git rev-parse origin/main)" = "$SHA" ] || { echo "main a avancé depuis $SHA : rien à faire."; exit 0; }
          owner="${OWNER,,}"
          cd overlays/lab
          kustomize edit set image \
            "ml-api=ghcr.io/${owner}/ml-api:${SHA}" \
            "ml-dashboard=ghcr.io/${owner}/ml-dashboard:${SHA}"
      - name: Commit et push
        env:
          SHA: ${{ github.sha }}
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deploy): images ${SHA::7}"
          git pull --rebase -q origin main
          git push origin HEAD:main
          # Un push fait avec GITHUB_TOKEN ne relance pas ce workflow : pas de boucle infinie.
