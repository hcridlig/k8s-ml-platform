# Locust = simulateur d'utilisateurs. Architecture maître / travailleurs :
#   - le maître porte l'interface web (port 8089) et coordonne ;
#   - les travailleurs génèrent réellement les requêtes (un processus Python chacun, d'où plusieurs).
# Le dashboard pilote le maître via son API HTTP (boutons "Charge") ; tu peux aussi ouvrir l'interface Locust.
# Les utilisateurs simulés appellent le Service ml-api depuis l'INTÉRIEUR du cluster : pas de goulot réseau côté PC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: locustfile
  namespace: loadtest
data:
  # Un ConfigMap permet de changer le scénario sans reconstruire d'image (puis : kubectl rollout restart).
  locustfile.py: |
    import os
    import random

    from locust import HttpUser, between, task


    class Visiteur(HttpUser):
        # Pause de 1 à 3 s entre deux requêtes : ~0,5 requête/s par utilisateur (le dashboard compte là-dessus)
        wait_time = between(1, 3)

        def on_start(self):
            # kube-proxy répartit la charge par CONNEXION, pas par requête. Un utilisateur qui garde sa connexion
            # ouverte reste collé au même pod toute sa vie : les pods créés par l'autoscaler ne reçoivent presque rien.
            # "Connection: close" force une connexion par requête, donc une répartition réelle.
            # KEEPALIVE=1 (kubectl -n loadtest set env deploy/locust-worker KEEPALIVE=1) montre le problème.
            if not os.getenv("KEEPALIVE"):
                self.client.headers["Connection"] = "close"

        @task
        def predict(self):
            pixels = [random.randint(0, 16) for _ in range(64)]  # image 8x8 aléatoire : le coût CPU est le même
            self.client.post("/predict", json={"pixels": pixels}, name="/predict")
---
apiVersion: v1
kind: Service
metadata:
  name: locust-master
  namespace: loadtest
spec:
  selector:
    app: locust-master
  ports:
    - {name: web, port: 8089, targetPort: web}
    - {name: comm, port: 5557, targetPort: comm}   # les travailleurs se connectent ici
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-master
  namespace: loadtest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: locust-master
  template:
    metadata:
      labels:
        app: locust-master
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                    # l'image Locust tourne en utilisateur "locust" (uid 1000)
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: locust
          image: locustio/locust:2.46.7    # version figée, comme pour nos propres images
          args:
            - -f=/mnt/locust/locustfile.py
            - --master
            - --web-host=0.0.0.0           # IPv4 explicite : par défaut Locust écoute sur "::" et plante si IPv6 est désactivé dans le pod
            - --host=http://ml-api.ml-platform.svc.cluster.local   # le Service ml-api, depuis un autre namespace
          ports:
            - {name: web, containerPort: 8089}
            - {name: comm, containerPort: 5557}
          readinessProbe:
            httpGet: {path: /, port: web}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: web}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:                 # image tierce : on n'impose pas le système de fichiers en lecture seule
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: locustfile, mountPath: /mnt/locust}
      volumes:
        - name: locustfile
          configMap:
            name: locustfile
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: locust-worker
  namespace: loadtest
spec:
  replicas: 2                              # chaque travailleur est limité à ~1 CPU : plus de charge = plus de travailleurs
  selector:
    matchLabels:
      app: locust-worker
  template:
    metadata:
      labels:
        app: locust-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: locust
          image: locustio/locust:2.46.7
          args:
            - -f=/mnt/locust/locustfile.py
            - --worker
            - --master-host=locust-master      # DNS du Service, dans le même namespace
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: locustfile, mountPath: /mnt/locust}
      volumes:
        - name: locustfile
          configMap:
            name: locustfile
